            type: string
          - name: count
            label: Room Category (Single / Twin Sharing)
            type: string
          - name: label
            label: Capacity Label
            type: string
          - name: desc
            label: Description
            type: text
          - name: features
            label: Highlight Features / Bullet Points
            type: string
            list: true
          - name: img
            label: Hostel Photo
            type: image

  - name: news
    label: News & Research Bulletins
    type: file
    path: src/data/news.json
    fields:
