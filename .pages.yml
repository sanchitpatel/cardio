media:
  input: public
  output: /

content:
  - name: site
    label: Global Site Settings
    type: file
    path: src/data/site.json
    fields:
      - name: name
        label: Site Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: bookButtonLabel
        label: Header Book Now Button Text
        type: string
      - name: whatsappPhone
        label: WhatsApp Phone Number
        type: string
      - name: phone
        label: Contact Phone Display
        type: string
      - name: email
        label: Contact Email Address
        type: string
      - name: address
        label: Full Address
        type: text

  - name: hero
    label: Hero Section
    type: file
    path: src/data/hero.json
    fields:
      - name: headlineLine1
        label: Headline Line 1
        type: string
      - name: headlineLine2
        label: Headline Line 2
        type: string
      - name: subtitle
        label: Subtitle Text
        type: text
      - name: ctaPrimaryLabel
        label: Primary Button Text (Plan Your Event)
        type: string
      - name: ctaSecondaryLabel
        label: Secondary Button Text (Explore Faculties)
        type: string
      - name: badgePrefix
        label: Badge Prefix Text
        type: string
      - name: badgeText
        label: Highlight Badge Text
        type: string

  - name: about
    label: About Us Section & Page
    type: file
    path: src/data/about.json
    fields:
      - name: badge
        label: Home Section Badge
        type: string
      - name: title
        label: Home Section Title
        type: string
      - name: image
        label: Home Main Campus Photo
        type: image
      - name: paragraph1
        label: Home First Paragraph
        type: text
      - name: paragraph2
        label: Home Second Paragraph
        type: text
      - name: ctaLabel
        label: Home Button Text (Schedule a Visit)
        type: string
      - name: stats
        label: Statistics Counter Grid
        type: object
        list: true
        fields:
          - name: value
            label: Stat Value
            type: string
          - name: label
            label: Stat Label
            type: string
      - name: aboutPage
        label: Dedicated About Us Page Settings
        type: object
        fields:
          - name: badge
            label: Page Badge (e.g. University Vision & Heritage)
            type: string
          - name: titlePrefix
            label: Page Title Prefix (e.g. Empowering Future)
            type: string
          - name: titleHighlight
            label: Page Title Highlight (e.g. Global Leaders)
            type: string
          - name: subtitle
            label: Page Subtitle Description
            type: text
          - name: backButtonLabel
            label: Back Button Text (e.g. Back to Home)
            type: string
          - name: mainImage
            label: Page Feature Photo
            type: image
          - name: mainImageAlt
            label: Page Feature Photo Alt Description
            type: string
          - name: storyBadge
            label: Story Section Badge
            type: string
          - name: storyTitle
            label: Story Heading
            type: string
          - name: storyParagraph1
            label: Story Paragraph 1
            type: text
          - name: storyParagraph2
            label: Story Paragraph 2
            type: text
          - name: storyParagraph3
            label: Story Paragraph 3
            type: text
          - name: features
            label: Feature Bullet Cards
            type: object
            list: true
            fields:
              - name: title
                label: Feature Title
                type: string
              - name: desc
                label: Feature Description
                type: text
          - name: pillarsBadge
            label: Core Pillars Section Badge
            type: string
          - name: pillarsTitle
            label: Core Pillars Section Title
            type: string
          - name: pillars
            label: Core Pillar Cards
            type: object
            list: true
            fields:
              - name: title
                label: Pillar Title
                type: string
              - name: desc
                label: Pillar Description
                type: text
          - name: ctaTitle
            label: Page Bottom CTA Title
            type: string
          - name: ctaSubtitle
            label: Page Bottom CTA Subtitle
            type: text
          - name: ctaButtonLabel
            label: Page Bottom CTA Button Text
            type: string

  - name: faculties
    label: Colleges & Faculties
    type: file
    path: src/data/faculties.json
    fields:
      - name: badge
        label: Section Badge
        type: string
      - name: title
        label: Main Title
        type: string
      - name: subtitle
        label: Subtitle Description
        type: text
      - name: ctaLabel
        label: Button Text (Explore All Faculties)
        type: string
      - name: featured
        label: Featured Major Institutions
        type: object
        list: true
        fields:
          - name: name
            label: Faculty Name
            type: string
          - name: desc
            label: Description
            type: text
          - name: stats
            label: Degree Programs / Stats
            type: string
          - name: img
            label: Faculty Image
            type: image
      - name: secondary
        label: Additional Faculties
        type: object
        list: true
        fields:
          - name: name
            label: Faculty Name
            type: string
          - name: stats
            label: Programs Offered
            type: string
          - name: img
            label: Faculty Image
            type: image
      - name: spacesPage
        label: Dedicated Faculties Page Settings
        type: object
        fields:
          - name: backButtonLabel
            label: Back Button Label Text
            type: string
          - name: badge
            label: Page Badge
            type: string
          - name: titlePrefix
            label: Title Prefix
            type: string
          - name: titleHighlight
            label: Title Highlight
            type: string
          - name: subtitle
            label: Page Subtitle Description
            type: text
          - name: heroImage
            label: Hero Showcase Image
            type: image
          - name: heroImageAlt
            label: Hero Showcase Image Alt Text
            type: string
          - name: heroImageCaption
            label: Hero Showcase Image Caption Overlay
            type: string
          - name: spacesList
            label: Dedicated Page Faculties List
            type: object
            list: true
            fields:
              - name: name
                label: Faculty Name
                type: string
              - name: category
                label: Category (Medical Sciences / Dental Surgery / Technology & AI / Business & Law)
                type: string
              - name: desc
                label: Description
                type: text
              - name: capacity
                label: Guest Capacity
                type: string
              - name: area
                label: Square Footage / Area
                type: string
              - name: idealFor
                label: Ideal Event Types
                type: string
              - name: img
                label: Space Photo
                type: image
          - name: amenitiesBadge
            label: Infrastructure Badge
            type: string
          - name: amenitiesTitle
            label: Infrastructure Title
            type: string
          - name: amenities
            label: Infrastructure & Facilities List
            type: object
            list: true
            fields:
              - name: title
                label: Facility Title
                type: string
              - name: desc
                label: Facility Description
                type: text
          - name: ctaTitle
            label: Bottom CTA Title
            type: string
          - name: ctaSubtitle
            label: Bottom CTA Subtitle
            type: text
          - name: ctaButtonLabel
            label: Bottom CTA Button Label
            type: string

  - name: experiences
    label: Offerings & Experiences
    type: file
    path: src/data/experiences.json
    fields:
      - name: badge
        label: Section Badge
        type: string
      - name: title
        label: Main Title
        type: string
      - name: subtitle
        label: Subtitle
        type: text
      - name: ctaLabel
        label: Button Text (Learn More)
        type: string
      - name: offerings
        label: Service Offerings List
        type: object
        list: true
        fields:
          - name: title
            label: Service Title
            type: string
          - name: desc
            label: Service Description
            type: text
      - name: images
        label: Experience Collage Photos
        type: object
        list: true
        fields:
          - name: img
            label: Photo Image
            type: image
          - name: alt
            label: Caption / Alt Description
            type: string

  - name: corporate
    label: Corporate Events
    type: file
    path: src/data/corporate.json
    fields:
      - name: badge
        label: Section Badge
        type: string
      - name: titleLine1
        label: Title Line 1
        type: string
      - name: titleLine2
        label: Title Line 2
        type: string
      - name: bgImage
        label: Background Image
        type: image
      - name: subtitle
        label: Subtitle Paragraph
        type: text
      - name: ctaPrimaryLabel
        label: Primary Button Text (Plan Your Offsite)
        type: string
      - name: ctaSecondaryLabel
        label: Secondary Button Text (Locate Us)
        type: string
      - name: stats
        label: Corporate Stats
        type: object
        list: true
        fields:
          - name: value
            label: Stat Value
            type: string
          - name: label
            label: Stat Label
            type: string

  - name: gallery
    label: Candid Photo Gallery
    type: file
    path: src/data/gallery.json
    fields:
      - name: badge
        label: Home Section Badge
        type: string
      - name: titlePrefix
        label: Home Title Prefix
        type: string
      - name: titleSuffix
        label: Home Title Suffix
        type: string
      - name: subtitle
        label: Home Subtitle
        type: text
      - name: ctaLabel
        label: Home Button Text (View All Photos)
