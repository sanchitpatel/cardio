      - name: galleryPage
        label: Dedicated Gallery Page Settings
        type: object
        fields:
          - name: badge
            label: Page Badge (e.g. Visual Archives)
            type: string
          - name: titlePrefix
            label: Page Title Prefix (e.g. BIU)
            type: string
          - name: titleHighlight
            label: Page Title Highlight (e.g. Photo Gallery)
            type: string
          - name: subtitle
            label: Page Subtitle Description
            type: text
          - name: backButtonLabel
            label: Back Button Text (e.g. Back to Home)
            type: string
          - name: emptyStateMessage
            label: Empty State Message
            type: string
      - name: images
        label: Photo Collection (All Photos)
        type: object
        list: true
        fields:
          - name: name
            label: Image File
            type: image
          - name: alt
            label: Alt Text
            type: string
          - name: caption
            label: Photo Caption / Lightbox Title
            type: string

  - name: hostels
    label: Hostels & Student Residencies
    type: file
    path: src/data/hostels.json
