        label: Section Badge
        type: string
      - name: title
        label: Section Title
        type: string
      - name: viewAllLabel
        label: View All Link Text
        type: string
      - name: posts
        label: News Articles List
        type: object
        list: true
        fields:
          - name: id
            label: Unique Slug / ID
            type: string
          - name: title
            label: Article Title
            type: string
          - name: date
            label: Date (YYYY-MM-DD)
            type: date
          - name: readTime
            label: Estimated Read Time (e.g. 5 min read)
            type: string
          - name: category
            label: Category (Medical Innovation / Placement Milestones / Campus Life)
            type: string
          - name: excerpt
            label: Summary / Excerpt
            type: text
          - name: content
            label: Full Article Content
            type: text
          - name: img
            label: Article Cover Photo
            type: image
      - name: journalPage
        label: Dedicated Journal Page Settings
        type: object
        fields:
          - name: backButtonLabel
            label: Back Button Text
            type: string
          - name: badge
            label: Page Badge
            type: string
          - name: titlePrefix
            label: Title Prefix
            type: string
          - name: titleHighlight
            label: Title Highlight
            type: string
          - name: subtitle
            label: Page Subtitle Description
            type: text
          - name: featuredPostId
            label: Featured Article ID
            type: string
          - name: featuredCaption
            label: Featured Badge Caption
            type: string
          - name: ctaTitle
            label: Bottom CTA Title
            type: string
          - name: ctaSubtitle
            label: Bottom CTA Subtitle
            type: text
          - name: ctaButtonLabel
            label: Bottom CTA Button Label
            type: string

  - name: testimonials
